<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Zvuk Desktop</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <!-- Авторизация -->
    <div id="auth-overlay" class="auth-overlay hidden">
      <div class="auth-card">
        <h1>Zvuk <span>Desktop</span></h1>
        <p class="auth-hint">
          Вход выполняется в окне приложения (Sber ID) — cookies и WAF обрабатываются нативно.
          Токен сохраняется в macOS Keychain.
        </p>
        <button id="auth-open-browser" class="btn primary">Войти в окне приложения</button>
        <div class="auth-sep">или вставьте токен вручную</div>
        <input id="auth-token-input" type="password" placeholder="Вставьте X-Auth-Token" autocomplete="off" />
        <button id="auth-save-token" class="btn">Войти</button>
        <p id="auth-status" class="auth-status"></p>
      </div>
    </div>

    <!-- Каркас приложения -->
    <div id="app" class="app hidden">
      <aside class="sidebar">
        <div class="brand">Zvuk <span>Desktop</span></div>
        <nav id="nav" class="nav">
          <a href="#/home" class="nav-item" data-route="home">Главная</a>
          <a href="#/search" class="nav-item" data-route="search">Поиск</a>
          <a href="#/collection" class="nav-item" data-route="collection">Коллекция</a>
          <a href="#/playlists" class="nav-item" data-route="playlists">Плейлисты</a>
          <a href="#/podcasts" class="nav-item" data-route="podcasts">Подкасты</a>
          <a href="#/settings" class="nav-item" data-route="settings">Настройки</a>
        </nav>
        <div class="sidebar-foot">
          <button id="logout" class="nav-item" data-route="logout">Выйти</button>
        </div>
      </aside>
      <main id="content" class="content"></main>
      <footer id="player-bar" class="player-bar"></footer>
    </div>

    <audio id="audio" preload="none"></audio>
  </body>
</html>
